services:
  db:
    image: postgres:16-alpine
    container_name: family-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_password}
      POSTGRES_DB: ${POSTGRES_DB:-family-db}
    ports:
      - "5432:5432"
    volumes:
      - family_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-family_user} -d ${POSTGRES_DB:-family-db} -h localhost",
        ]
      interval: 5s
      timeout: 5s
      retries: 10