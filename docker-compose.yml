services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-tree-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://family_tree:${POSTGRES_PASSWORD}@db:5432/family_tree
    depends_on:
      db:
        condition: service_healthy
    networks:
      - family_tree_network
      - kuber-proxy

  db:
    image: postgres:16-alpine
    container_name: family-tree-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_tree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: family_tree
    volumes:
      - family_tree_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree -d family_tree"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - family_tree_network

volumes:
  family_tree_pgdata:

networks:
  family_tree_network:
    driver: bridge
  kuber-proxy:
    external: true
